name: Release

# Pushing a version tag (v0.1.0, v1.2.3-rc.1) publishes it:
#   - binaries for Linux, macOS and Windows on amd64 and arm64, with
#     checksums and release notes, as a GitHub Release (GoReleaser)
#   - a multi-architecture image (linux/amd64, linux/arm64) on Docker Hub
#
#
# Every archive, checksums.txt and the image get a signed build
# provenance attestation (Sigstore, through GitHub), which anyone can
# check: gh attestation verify <file> --repo victor-akande/weistack
#
# Docker Hub needs, under Settings > Secrets and variables > Actions:
#   variable DOCKERHUB_REPOSITORY  victhedev/weistack
#   secret   DOCKERHUB_USERNAME    your Docker Hub user name
#   secret   DOCKERHUB_TOKEN       a Docker Hub access token with Read & Write

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.x"

jobs:
  binaries:
    name: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the attestations (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release notes need the history
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Tests
        run: go test -count=1 ./...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
      - name: Attest the archives and checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # sign the attestation (Sigstore)
      attestations: write
    steps:
      - name: Docker Hub settings are present
        env:
          REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          [ -n "$REPOSITORY" ] || missing="$missing variable DOCKERHUB_REPOSITORY,"
          [ -n "$USERNAME" ] || missing="$missing secret DOCKERHUB_USERNAME,"
          [ -n "$TOKEN" ] || missing="$missing secret DOCKERHUB_TOKEN,"
          if [ -n "$missing" ]; then
            echo "::error::Set${missing%,} under Settings > Secrets and variables > Actions"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.DOCKERHUB_REPOSITORY }}
          # v1.2.3 -> 1.2.3, 1.2 and latest; a pre-release such as
          # v1.2.3-rc.1 gets only its own tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
          flavor: |
            latest=${{ !contains(github.ref_name, '-') }}
      - name: Commit date
        id: date
        run: echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.date.outputs.date }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/${{ vars.DOCKERHUB_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Smoke test the published image
        env:
          IMAGE: ${{ vars.DOCKERHUB_REPOSITORY }}:${{ steps.meta.outputs.version }}
        run: |
          docker run -d --name weistack -p 8780:8780 "$IMAGE"
          for i in $(seq 1 50); do
            curl -fsS http://localhost:8780/_weistack/health && ok=1 && break
            sleep 0.2
          done
          test "${ok:-}" = 1
          docker logs weistack

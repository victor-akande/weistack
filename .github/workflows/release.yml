name: Release

# Pushing a version tag (v0.1.0, v1.2.3-rc.1) publishes it:
#   - binaries for Linux, macOS and Windows on amd64 and arm64, with
#     checksums and release notes, as a GitHub Release (GoReleaser)
#   - a multi-architecture image (linux/amd64, linux/arm64) on Docker Hub
#
# Docker Hub needs, under Settings > Secrets and variables > Actions:
#   variable DOCKERHUB_REPOSITORY  victhedev/weistack
#   secret   DOCKERHUB_USERNAME    your Docker Hub user name
#   secret   DOCKERHUB_TOKEN       a Docker Hub access token with Read & Write

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.x"

jobs:
  binaries:
    name: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes need the history
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Tests
        run: go test -count=1 ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Docker Hub settings are present
        env:
          REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          [ -n "$REPOSITORY" ] || missing="$missing variable DOCKERHUB_REPOSITORY,"
          [ -n "$USERNAME" ] || missing="$missing secret DOCKERHUB_USERNAME,"
          [ -n "$TOKEN" ] || missing="$missing secret DOCKERHUB_TOKEN,"
          if [ -n "$missing" ]; then
            echo "::error::Set${missing%,} under Settings > Secrets and variables > Actions"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_REPOSITORY }}
          # v1.2.3 -> 1.2.3, 1.2 and latest; a pre-release such as
          # v1.2.3-rc.1 gets only its own tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
          flavor: |
            latest=${{ !contains(github.ref_name, '-') }}
      - name: Commit date
        id: date
        run: echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.date.outputs.date }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the published image
        env:
          IMAGE: ${{ vars.DOCKERHUB_REPOSITORY }}:${{ steps.meta.outputs.version }}
        run: |
          docker run -d --name weistack -p 8780:8780 "$IMAGE"
          for i in $(seq 1 50); do
            curl -fsS http://localhost:8780/_weistack/health && ok=1 && break
            sleep 0.2
          done
          test "${ok:-}" = 1
          docker logs weistack

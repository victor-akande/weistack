name: Fuzz

# Every night, each fuzz target runs for five minutes on main. CI runs
# them for seconds on every change; this is the longer search.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per target (a Go duration)
        default: 5m

permissions:
  contents: read

env:
  GO_VERSION: "1.27.x"

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Every fuzz target
        env:
          FUZZTIME: ${{ inputs.fuzztime || '5m' }}
        run: make fuzz
      - name: Keep failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"
          retention-days: 30

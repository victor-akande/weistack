name: Fuzz

# Every night, each fuzz target runs for five minutes on main. CI runs
# them for seconds on every change; this is the longer search.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per target (a Go duration)
        default: 5m

permissions:
  contents: read

env:
  GO_VERSION: "1.27.x"

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Every fuzz target
        env:
          FUZZTIME: ${{ inputs.fuzztime || '5m' }}
        run: make fuzz
      - name: Keep failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"
          retention-days: 30

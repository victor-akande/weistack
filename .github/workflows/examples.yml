name: Examples

# Runs examples/web-app's guide end to end (its test.sh) against a WeiStack
# built from this commit, started with the action under -iam=enforce -lan,
# as the guide's cloud machine runs it. KooCLI is not installed here, so
# test.sh skips its checks; the guide's other tools all run.

on:
  pull_request:
    paths:
      - examples/**
      - .github/workflows/examples.yml
      - action.yml
      - cmd/**
      - internal/**
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.27.x"

jobs:
  web-app:
    name: web-app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples/web-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - name: Build WeiStack
        working-directory: .
        run: go build -o bin/weistack ./cmd/weistack
      - name: Start it as the guide's cloud machine runs it
        id: weistack
        uses: ./
        with:
          binary: bin/weistack
          iam: enforce
          args: -lan
          proxy: false
      - name: Trust its CA and install the guide's tools
        run: |
          sudo cp "${{ steps.weistack.outputs.ca-file }}" /usr/local/share/ca-certificates/weistack.crt
          sudo update-ca-certificates
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -r requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          (cd smoke && go build -o ../bin/smoke .)
          echo "127.0.0.1 obs.ap-southeast-1.myhuaweicloud.com" | sudo tee -a /etc/hosts
      - name: Run the guide (steps 3 to 9 and 11)
        env:
          WEISTACK: https://127.0.0.1:8781
          ADMIN_AK: ${{ steps.weistack.outputs.access-key }}
          ADMIN_SK: ${{ steps.weistack.outputs.secret-key }}
        run: ./test.sh
      - name: WeiStack's log
        if: failure()
        working-directory: .
        run: cat "${{ steps.weistack.outputs.log-file }}"

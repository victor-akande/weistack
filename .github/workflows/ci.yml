name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.27.x"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: govulncheck
        run: make vuln

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Unit and HTTP tests (race, coverage)
        run: make test
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  sdk:
    name: sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          # The SDK is a very large module: cache it on its own lock file.
          cache-dependency-path: |
            go.sum
            test/sdk/go.sum
      - name: Tests driven by the official Huawei Cloud Go SDK
        run: make test-sdk

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"
          # The wrapper rewrites output and exit codes, which run.sh reads.
          terraform_wrapper: false
      - name: Cache the provider
        uses: actions/cache@v6
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ hashFiles('test/terraform/.terraform.lock.hcl') }}
      - name: Apply, re-plan and destroy through the HTTPS proxy
        run: |
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          make test-terraform

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: weistack:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size budget (40 MB)
        run: |
          bytes=$(docker image inspect weistack:ci --format '{{.Size}}')
          echo "image size: $((bytes / 1024 / 1024)) MB ($bytes bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$bytes" -lt $((40 * 1024 * 1024))
      - name: Smoke test
        run: |
          docker run -d --name weistack -p 8780:8780 weistack:ci
          for i in $(seq 1 50); do
            if curl -fsS http://localhost:8780/_weistack/health; then ok=1; break; fi
            sleep 0.2
          done
          test "${ok:-}" = 1
          curl -fsS http://localhost:8780/_weistack/services
          # The built-in probe used by the Docker HEALTHCHECK.
          docker exec weistack /weistack healthcheck
          # Idle memory budget: 50 MB.
          mem=$(docker stats --no-stream --format '{{.MemUsage}}' weistack)
          echo "idle memory: $mem" | tee -a "$GITHUB_STEP_SUMMARY"
          # Graceful shutdown must exit 0 well inside the timeout.
          docker stop -t 15 weistack
          test "$(docker inspect weistack --format '{{.State.ExitCode}}')" = 0
      - name: Container logs
        if: always()
        run: docker logs weistack || true

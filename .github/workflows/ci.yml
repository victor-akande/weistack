name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.27.x"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: govulncheck
        run: make vuln

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Unit and HTTP tests (race, coverage)
        run: make test
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  sdk:
    name: sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          # The SDK is a very large module: cache it on its own lock file.
          cache-dependency-path: |
            go.sum
            test/sdk/go.sum
      - name: Tests driven by the official Huawei Cloud Go SDK
        run: make test-sdk

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"
          # The wrapper rewrites output and exit codes, which run.sh reads.
          terraform_wrapper: false
      - name: Cache the provider
        uses: actions/cache@v6
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ hashFiles('test/terraform/.terraform.lock.hcl') }}
      - name: Apply, re-plan and destroy through the HTTPS proxy
        run: |
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          make test-terraform

  perf:
    name: perf
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Performance budgets
        env:
          WEISTACK_PERF_REPORT: ${{ runner.temp }}/perf.json
        run: make perf
      - name: Report
        if: always()
        run: |
          {
            echo "### Performance"
            echo
            echo "| Metric | This run | Baseline |"
            echo "| --- | --- | --- |"
            jq -r --slurpfile base test/perf/baseline.json \
              'to_entries[] | "| \(.key) | \(.value) | \($base[0][.key] // "–") |"' "$RUNNER_TEMP/perf.json"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: weistack:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size budget (40 MB)
        run: |
          bytes=$(docker image inspect weistack:ci --format '{{.Size}}')
          echo "image size: $((bytes / 1024 / 1024)) MB ($bytes bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$bytes" -lt $((40 * 1024 * 1024))
      - name: Smoke test
        run: |
          docker run -d --name weistack -p 8780:8780 weistack:ci
          for i in $(seq 1 50); do
            if curl -fsS http://localhost:8780/_weistack/health; then ok=1; break; fi
            sleep 0.2
          done
          test "${ok:-}" = 1
          curl -fsS http://localhost:8780/_weistack/services
          # The built-in probe used by the Docker HEALTHCHECK.
          docker exec weistack /weistack healthcheck
          # Idle memory budget: 50 MB.
          mem=$(docker stats --no-stream --format '{{.MemUsage}}' weistack)
          echo "idle memory: $mem" | tee -a "$GITHUB_STEP_SUMMARY"
          # Graceful shutdown must exit 0 well inside the timeout.
          docker stop -t 15 weistack
          test "$(docker inspect weistack --format '{{.State.ExitCode}}')" = 0
      - name: Persistence across a container restart
        run: |
          docker volume create weistack-data
          docker run -d --name persisted -p 8781:8780 -e WEISTACK_PERSIST=1 -v weistack-data:/data weistack:ci
          wait_healthy() {
            for i in $(seq 1 50); do
              curl -fsS http://localhost:8781/_weistack/health >/dev/null 2>&1 && return 0
              sleep 0.2
            done
            return 1
          }
          wait_healthy
          project=$(curl -fsS http://localhost:8781/_weistack/services | jq -r .project_id)
          vpc=$(curl -fsS -X POST "http://localhost:8781/vpc/v1/$project/vpcs" \
            -d '{"vpc": {"name": "survivor", "cidr": "10.0.0.0/16"}}' | jq -r .vpc.id)
          echo "created VPC $vpc in project $project"
          ca=$(curl -fsS http://localhost:8781/_weistack/ca)
          docker restart -t 15 persisted
          wait_healthy
          # Same project, same VPC, and its creation finished.
          test "$(curl -fsS http://localhost:8781/_weistack/services | jq -r .project_id)" = "$project"
          for i in $(seq 1 50); do
            status=$(curl -fsS "http://localhost:8781/vpc/v1/$project/vpcs/$vpc" | jq -r .vpc.status)
            [ "$status" = OK ] && break
            sleep 0.2
          done
          test "$status" = OK
          # The CA is kept in the volume too, so clients trust it once.
          test "$(curl -fsS http://localhost:8781/_weistack/ca)" = "$ca"
          docker stop -t 15 persisted
      - name: Container logs
        if: always()
        run: |
          docker logs weistack || true
          docker logs persisted || true

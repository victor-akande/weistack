name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.27.x"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: govulncheck
        run: make vuln

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Every fuzz target, briefly (the nightly run fuzzes longer)
        run: make fuzz FUZZTIME=10s
      - name: Keep failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"
          retention-days: 14

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Unit and HTTP tests (race, coverage)
        run: make test
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  sdk:
    name: sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # The SDK is a very large module: cache it on its own lock file.
          cache-dependency-path: |
            go.sum
            test/sdk/go.sum
      - name: Tests driven by the official Huawei Cloud Go SDK
        run: make test-sdk
      - name: The same tests with credentials enforced (-iam=enforce)
        run: make test-sdk
        env:
          WEISTACK_SDK_IAM: enforce

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
          # The wrapper rewrites output and exit codes, which run.sh reads.
          terraform_wrapper: false
      - name: Cache the provider
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ hashFiles('test/terraform/.terraform.lock.hcl') }}
      - name: Apply, re-plan and destroy through the HTTPS proxy
        run: |
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          make test-terraform
      - name: The same with credentials enforced (-iam=enforce)
        run: |
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          WEISTACK_TF_IAM=enforce make test-terraform

  perf:
    name: perf
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Performance budgets
        env:
          WEISTACK_PERF_REPORT: ${{ runner.temp }}/perf.json
        run: make perf
      - name: Report
        if: always()
        run: |
          {
            echo "### Performance"
            echo
            echo "| Metric | This run | Baseline |"
            echo "| --- | --- | --- |"
            jq -r --slurpfile base test/perf/baseline.json \
              'to_entries[] | "| \(.key) | \(.value) | \($base[0][.key] // "–") |"' "$RUNNER_TEMP/perf.json"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  release-check:
    name: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # Every release target must keep compiling, not only Linux.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean
      - name: Built targets
        run: ls -l dist/*/weistack* | tee -a "$GITHUB_STEP_SUMMARY"

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: weistack:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: The image is built with a Go release CI has vetted
        # govulncheck (lint job) vets the code with the newest Go 1.27.x;
        # the image's binary must not be built with an older one, which
        # would ship without its standard library fixes. Dependabot
        # proposes new base image digests (Dockerfile).
        run: |
          id=$(docker create weistack:ci)
          docker cp "$id:/weistack" ./weistack-image-bin
          docker rm "$id"
          image=$(go version ./weistack-image-bin | awk '{print $2}')
          vetted=$(go env GOVERSION)
          echo "image built with $image; govulncheck vets with $vetted" | tee -a "$GITHUB_STEP_SUMMARY"
          oldest=$(printf '%s\n%s\n' "$image" "$vetted" | sort -V | head -n 1)
          if [ "$image" != "$vetted" ] && [ "$oldest" = "$image" ]; then
            echo "::error file=Dockerfile::the image is built with $image, older than $vetted: update the golang image in the Dockerfile"
            exit 1
          fi
      - name: Image size budget (40 MB)
        run: |
          bytes=$(docker image inspect weistack:ci --format '{{.Size}}')
          echo "image size: $((bytes / 1024 / 1024)) MB ($bytes bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$bytes" -lt $((40 * 1024 * 1024))
      - name: Smoke test
        run: |
          docker run -d --name weistack -p 8780:8780 weistack:ci
          for i in $(seq 1 50); do
            if curl -fsS http://localhost:8780/_weistack/health; then ok=1; break; fi
            sleep 0.2
          done
          test "${ok:-}" = 1
          curl -fsS http://localhost:8780/_weistack/services
          # The built-in probe used by the Docker HEALTHCHECK.
          docker exec weistack /weistack healthcheck
          # Idle memory budget: 50 MB.
          mem=$(docker stats --no-stream --format '{{.MemUsage}}' weistack)
          echo "idle memory: $mem" | tee -a "$GITHUB_STEP_SUMMARY"
          # Graceful shutdown must exit 0 well inside the timeout.
          docker stop -t 15 weistack
          test "$(docker inspect weistack --format '{{.State.ExitCode}}')" = 0
      - name: Persistence across a container restart
        run: |
          docker volume create weistack-data
          docker run -d --name persisted -p 8781:8780 -e WEISTACK_PERSIST=1 -v weistack-data:/data weistack:ci
          wait_healthy() {
            for i in $(seq 1 50); do
              curl -fsS http://localhost:8781/_weistack/health >/dev/null 2>&1 && return 0
              sleep 0.2
            done
            return 1
          }
          wait_healthy
          project=$(curl -fsS http://localhost:8781/_weistack/services | jq -r .project_id)
          vpc=$(curl -fsS -X POST "http://localhost:8781/vpc/v1/$project/vpcs" \
            -d '{"vpc": {"name": "survivor", "cidr": "10.0.0.0/16"}}' | jq -r .vpc.id)
          echo "created VPC $vpc in project $project"
          ca=$(curl -fsS http://localhost:8781/_weistack/ca)
          docker restart -t 15 persisted
          wait_healthy
          # Same project, same VPC, and its creation finished.
          test "$(curl -fsS http://localhost:8781/_weistack/services | jq -r .project_id)" = "$project"
          for i in $(seq 1 50); do
            status=$(curl -fsS "http://localhost:8781/vpc/v1/$project/vpcs/$vpc" | jq -r .vpc.status)
            [ "$status" = OK ] && break
            sleep 0.2
          done
          test "$status" = OK
          # The CA is kept in the volume too, so clients trust it once.
          test "$(curl -fsS http://localhost:8781/_weistack/ca)" = "$ca"
          docker stop -t 15 persisted
      - name: Container logs
        if: always()
        run: |
          docker logs weistack || true
          docker logs persisted || true

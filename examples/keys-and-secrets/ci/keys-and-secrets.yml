# Test every change to the stack in CI. Copy this file to
# .github/workflows/ in the repository that holds these files (adjust the
# paths if they live elsewhere).
#
# On each pull request WeiStack starts inside the job with -iam=enforce
# -lan, and test.sh runs the guide: the administrator creates the three
# users (iam/), the deployer applies the stack (infra/) and uploads the
# configuration, the app reads its token and the deployer rotates it, the
# operator and the administrator check everything, and it is all
# destroyed. A typo, a missing permission or a secret readable by the
# wrong user fails the pull request.
#
# The actions are named by tag for readability; pin each to a commit SHA
# in your own repository.
name: keys-and-secrets

on:
  pull_request:
    paths: ["examples/keys-and-secrets/**"]

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/keys-and-secrets
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/keys-and-secrets/check/go.mod
          cache-dependency-path: examples/keys-and-secrets/check/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # WeiStack for the rest of the job: credentials and permissions
      # checked, other machines served over HTTPS on 8781, as in the guide.
      - uses: victor-akande/weistack@v0.4.1
        id: weistack
        with:
          iam: enforce
          args: -lan
          proxy: false

      - name: Trust WeiStack's CA and install the tools
        run: |
          sudo cp "${{ steps.weistack.outputs.ca-file }}" /usr/local/share/ca-certificates/weistack.crt
          sudo update-ca-certificates
          python -m pip install -r requirements.txt
          (cd check && go build -o ../bin/check .)

      - name: Run the guide, steps 3 to 10 and 12
        env:
          WEISTACK: https://127.0.0.1:8781
          ADMIN_AK: ${{ steps.weistack.outputs.access-key }}
          ADMIN_SK: ${{ steps.weistack.outputs.secret-key }}
        run: ./test.sh

      - name: WeiStack's log
        if: failure()
        run: cat "${{ steps.weistack.outputs.log-file }}"

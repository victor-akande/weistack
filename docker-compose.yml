# Example: a persistent WeiStack on http://localhost:8780
services:
  weistack:
    build: .
    image: weistack/weistack:dev
    ports:
      - "127.0.0.1:8780:8780"
    environment:
      WEISTACK_PERSIST: "1"
      WEISTACK_REGION: ap-southeast-1
    volumes:
      - weistack-data:/data
    restart: unless-stopped

volumes:
  weistack-data:
